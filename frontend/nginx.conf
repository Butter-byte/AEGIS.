# Static serving for the built Vite SPA. No API/WS proxying — the browser talks
# to the backend directly via VITE_API_URL / VITE_WS_URL baked in at build time.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths resolve to index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
